name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - supabase/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref hpdcfkhwznlcecjtdtid --password ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push --linked --password ${{ secrets.SUPABASE_DB_PASSWORD }} --yes
